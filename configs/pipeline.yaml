# Pipeline settings. The app reads only this file.
# Notebooks decide the values; null means "not decided yet".

# Shared media settings (decided in notebook 10).
media:
  sample_rate: 16000
  frames_per_segment: 10

# Bark detector (decided in notebook 10).
bark_detector:
  model: frame_mn10
  threshold: 0.08       
  median_frames: 1     
  max_gap_s: 0.0   
  min_event_s: 0.16  

# Dog detector (decided in notebook 15).
dog_detector:
  model: nano
  score_threshold: 0.5

branches:
  # Audio branch (decided in notebooks 20 and 21).
  audio:
    encoder: beats_iter3_plus_as2m
    layer: null
    min_seconds: 1.0
    chunk_seconds: 10.0
    batch_size: 1

  # Body-language branch (decided in notebooks 30 and 31).
  body:
    # Paths are relative to the repo root. Weights are NOT in git (models/ is ignored):
    # copy them in by hand, or from /work/cssema416/202710/05/dog-vocal-interpreter/models/ on the server.
    detector: null  # not separate: the pose model finds the dog box too
    pose: models/pose/yolo11m-pose_full/weights/best.pt  # encoder, notebook 30
    head: models/pose/decoder/pose_decoder_64.pt  # decoder, notebook 31 (64 features, lr 0.003)

  # Frozen scene encoder for fusion (checked in notebook 41).
  scene:
    encoder: yoloe_object_pool_v1
    model: models/scene/yoloe-11s-seg-pf.pt
    confidence: 0.25
    image_size: 640
    max_objects: 32

# Fusion of branch outputs (decided in notebook 50).
fusion:
  method: weighted_average
  weights:
    audio: 0.34
    body: 0.33
    scene: 0.33
  temperature: 1.0
